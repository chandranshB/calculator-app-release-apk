<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shanculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #f5f2ed;
      color: #1a1a1a;
      font-family: 'Geist Mono', 'Courier New', monospace;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .wrap {
      max-width: 360px;
      width: 100%;
      animation: up .5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: clamp(2.8rem, 10vw, 4rem);
      font-weight: 400;
      letter-spacing: -.03em;
      line-height: 1;
      margin-bottom: .5rem;
    }

    .sub {
      font-size: .72rem;
      color: #999;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #1a1a1a;
      color: #f5f2ed;
      text-decoration: none;
      padding: 1rem 1.25rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: .82rem;
      font-weight: 400;
      letter-spacing: .04em;
      cursor: pointer;
      transition: opacity .2s;
      width: 100%;
      border: none;
      text-align: left;
    }

    .btn:hover:not(:disabled) { opacity: .75; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.loading svg { animation: bob .8s ease-in-out infinite; }

    @keyframes bob {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(3px); }
    }

    #ver {
      margin-top: 1rem;
      font-size: .7rem;
      color: #bbb;
      letter-spacing: .04em;
      min-height: 1em;
    }

    #ver a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }

    .foot {
      margin-top: 3.5rem;
      font-size: .68rem;
      color: #bbb;
      letter-spacing: .04em;
      display: flex;
      gap: 1.5rem;
    }

    .foot a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid #ddd;
      padding-bottom: 1px;
      transition: color .15s;
    }

    .foot a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="name">Shanculator</div>
    <div class="sub">Calculator app &nbsp;·&nbsp; Android</div>

    <button id="dl" class="btn loading" disabled>
      <span id="dl-label">Fetching latest…</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 1v8M3.5 6 7 9.5 10.5 6M1.5 12h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div id="ver"></div>

    <div class="foot">
      <a href="https://github.com/chandranshB/calculator-app-release-apk" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/chandranshB/calculator-app-release-apk/releases" target="_blank" rel="noopener">All releases</a>
    </div>
  </div>
</main>

<script>
  const btn   = document.getElementById('dl');
  const label = document.getElementById('dl-label');
  const ver   = document.getElementById('ver');

  let apkUrl = null;

  fetch('https://api.github.com/repos/chandranshB/calculator-app-release-apk/releases/latest')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      const tag  = data.tag_name ?? 'latest';
      const apk  = (data.assets ?? []).find(a => a.name.endsWith('.apk'));
      apkUrl     = apk?.browser_download_url ?? data.zipball_url;
      const size = apk ? ` · ${(apk.size / 1048576).toFixed(1)} MB` : '';

      label.textContent = 'Download APK';
      btn.disabled = false;
      btn.classList.remove('loading');

      ver.innerHTML =
        `<a href="https://github.com/chandranshB/calculator-app-release-apk/releases/tag/${encodeURIComponent(tag)}"
           target="_blank" rel="noopener">${tag}</a>${size}`;
    })
    .catch(() => {
      // hard-coded fallback to known latest APK
      apkUrl = 'https://github.com/chandranshB/calculator-app-release-apk/releases/latest/download/app-release.apk';
      label.textContent = 'Download APK';
      btn.disabled = false;
      btn.classList.remove('loading');
    });

  btn.addEventListener('click', () => {
    if (!apkUrl) return;
    // window.location.href lets GitHub serve the file with its own
    // Content-Disposition: attachment header — triggers a real download
    window.location.href = apkUrl;
  });
</script>
</body>
</html>
